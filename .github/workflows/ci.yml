name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, unit tests, privacy checks, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build-logic tests (convention plugins, privacy rules)
        run: ./gradlew -p build-logic test

      - name: Check (lint, unit tests, module and privacy checks) and coverage
        run: ./gradlew check koverXmlReport koverHtmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
            **/build/reports/privacy/
            build/reports/kover/
          if-no-files-found: ignore
